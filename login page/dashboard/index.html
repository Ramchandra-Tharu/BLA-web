<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | SR Academy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Welcome to SR Academy</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <section class="dashboard">
    <h2>Student Dashboard</h2>
    <div class="card-container">
      <div class="card">
        <h3>📚 My Subjects</h3>
        <p>Mathematics, Science, English, Computer, History</p>
      </div>

      <div class="card">
        <h3>🧾 My Attendance</h3>
        <p>Present: 89% ✅</p>
      </div>

      <div class="card">
        <h3>🎯 Latest Notices</h3>
        <p>Annual Sports Meet on 10th Nov. All students must attend!</p>
      </div>

      <div class="card">
        <h3>🏆 Exam Results</h3>
        <p>Mid Term: 86% | Rank: 3rd</p>
      </div>
    </div>
  </section>

  <script>
    function logout() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
