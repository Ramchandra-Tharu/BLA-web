<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | SR Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>SR Academy</h1>
      <h2>Student Login</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="email">Student ID / Email</label>
          <input type="text" id="email" placeholder="Enter your ID or email" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit">Login</button>
      </form>

      <!-- Message will show here -->
      <p id="message"></p>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const demoEmail = "sracademy@gmail.com";
      const demoPassword = "student";

      if (email === demoEmail && password === demoPassword) {
        message.textContent = "✅ Login Successful! Welcome to SR Academy.";
        message.style.color = "#00ff88";

        // Optional: show dashboard section here
        setTimeout(() => {
          window.location.href = "student-dashboard.html";
        }, 1500);
      } else {
        message.textContent = "❌ Invalid Email or Password. Please try again.";
        message.style.color = "#ff4d4d";
      }
    });
  </script>
</body>
</html>
