<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | SR Academy</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    header {
      background: #212121;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout-btn {
      background: #ffeb3b;
      color: #1e3c72;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .logout-btn:hover {
      background:black;
    }

    .profile-section {
      text-align: center;
      padding: 30px 20px;
      color: black;
    }

    .profile-pic {
      width: 120px;
      border-radius: 50%;
    }

    .dashboard {
      padding: 40px;
      text-align: center;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      color: black;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header>
    <h1>🎓 Student Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <section class="profile-section">
    <img src="https://cdn-icons-png.flaticon.com/512/219/219986.png" alt="Student" class="profile-pic">
    <h2>Welcome, John Doe</h2>
    <p>Class: 10th | Roll No: 21 | Section: A</p>
  </section>

  <section class="dashboard">
    <div class="card-container">
      <div class="card"><h3>📚 My Subjects</h3><p>Maths, Science, English, Computer</p></div>
      <div class="card"><h3>🧾 Attendance</h3><p>Present: 92% ✅</p></div>
      <div class="card"><h3>🎯 Notices</h3><p>Final exams start from 12th December.</p></div>
      <div class="card"><h3>🏆 Results</h3><p>Mid Term: 88% | Rank: 4th</p></div>
    </div>
  </section>

  <script>
    function logout() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
