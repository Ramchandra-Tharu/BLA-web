<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online School Admission Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-container">
    <h1>Online Admission Form</h1>
    <form id="admissionForm" class="admission-form">

      <!-- Student Details -->
      <section>
        <h2>Student Details</h2>
        <div class="grid">
          <input type="text" placeholder="Full Name" required>
          <input type="date" placeholder="Date of Birth" required>
          <select required>
            <option value="">Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
          <input type="text" placeholder="Blood Group">
          <input type="text" placeholder="Nationality">
          <input type="text" placeholder="Aadhar Number (Optional)">
          <input type="tel" placeholder="Contact Number">
          <textarea rows="3" placeholder="Address"></textarea>
        </div>
      </section>

      <!-- Parent Details -->
      <section>
        <h2>Parent / Guardian Details</h2>
        <div class="grid">
          <input type="text" placeholder="Father's Name">
          <input type="text" placeholder="Father's Occupation">
          <input type="tel" placeholder="Father's Contact">
          <input type="text" placeholder="Mother's Name">
          <input type="text" placeholder="Mother's Occupation">
          <input type="tel" placeholder="Mother's Contact">
          <input type="email" placeholder="Email ID (optional)">
        </div>
      </section>

      <!-- Education -->
      <section>
        <h2>Educational Details</h2>
        <div class="grid">
          <input type="text" placeholder="Previous School Name">
          <select>
            <option value="">Board</option>
            <option>CBSE</option>
            <option>ICSE</option>
            <option>State Board</option>
            <option>Other</option>
          </select>
          <input type="text" placeholder="Last Class Passed">
          <input type="text" placeholder="Percentage / Grade">
          <input type="text" placeholder="Medium (e.g. English)">
        </div>
      </section>

      <!-- Admission -->
      <section>
        <h2>Admission Details</h2>
        <div class="grid">
          <input type="text" placeholder="Class for Admission">
          <input type="date" placeholder="Date of Admission">
          <select>
            <option>Admission Type</option>
            <option>New</option>
            <option>Transfer</option>
          </select>
        </div>
      </section>

      <!-- Declaration -->
      <section>
        <h2>Declaration</h2>
        <p>I hereby declare that all the information provided is correct to the best of my knowledge.</p>
      </section>

      <!-- Buttons -->
      <div class="buttons">
        <button type="reset" class="btn muted">Reset</button>
        <button type="submit" class="btn primary">Submit</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('admissionForm').addEventListener('submit', e => {
      e.preventDefault();
      alert('Form submitted successfully!');
    });
  </script>
</body>
</html>
